<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4a1466"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lorugum Guest House Records</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#241f1a;--mut:#7a7168;--ac:#4a1466;--acx:#fff;--ln:#e6e0d8;--ok:#2d7a4b;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171412;--card:#221e1b;--tx:#f1ebe4;--mut:#a39a90;--ac:#f5a83a;--acx:#1b1020;--ln:#38322d;--ok:#6cc58b;--bad:#f2867f}}
:root[data-theme="dark"]{--bg:#171412;--card:#221e1b;--tx:#f1ebe4;--mut:#a39a90;--ac:#f5a83a;--acx:#1b1020;--ln:#38322d;--ok:#6cc58b;--bad:#f2867f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 16px 0;max-width:1100px;margin:auto}
.logo{background:#fff;border-radius:10px;padding:6px 10px;display:inline-block;max-width:100%;border-bottom:3px solid #f39c1f}.logo img{display:block;height:46px;max-width:100%}.sub{margin:6px 0 10px;color:var(--mut);font-size:13px}
.pos{display:grid;grid-template-columns:2fr 1fr;gap:14px}@media(max-width:760px){.pos{grid-template-columns:1fr}}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.item{position:relative;text-align:left;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;cursor:pointer;font:inherit}.item b,.item span{display:block}.item span{color:var(--ac);font-weight:600}.item .x{position:absolute;top:4px;right:6px;font-style:normal}
h4{margin:12px 0 6px;font-size:13px;color:var(--mut)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--ln)}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);color:var(--tx);cursor:pointer}
.big{font-size:22px;font-weight:700;margin:8px 0}.pos .card>*+*{margin-top:8px}
body.pr main>*:not(#rcpt){display:none}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
nav button{white-space:nowrap;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);border-color:var(--ac);color:var(--acx)}
main{max-width:1100px;margin:auto;padding:6px 16px 40px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}
.stat small{color:var(--mut);display:block}.stat b{font-size:20px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
label{font-size:12px;color:var(--mut);display:block}
input,select{width:100%;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:var(--acx);cursor:pointer;font:inherit}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}
td.n{text-align:right}.low{color:var(--bad);font-weight:600}.pos{color:var(--ok)}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:16px}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar input{max-width:240px}
.note{color:var(--mut);font-size:12px}
@media print{header,nav,form,.x,.bar button{display:none}}
</style></head><body>

<script>
const n=v=>parseFloat(v)||0, fmt=v=>n(v).toLocaleString(undefined,{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const PAY=['Cash','Mobile money','Card','Tab / credit','Room charge'];
const M={
 rooms:{t:'Rooms & Guests',f:[['date','date','Check-in'],['guest','text','Guest name'],['idno','text','ID / passport'],['phone','tel','Phone'],['room','text','Room no.'],['nights','number','Nights'],['rate','number','Rate / night'],['paid','number','Amount paid'],['status','select','Status',['Checked in','Booked','Checked out']]],
  c:[['Total',r=>n(r.nights)*n(r.rate)],['Balance',r=>n(r.nights)*n(r.rate)-n(r.paid)]]},
 sales:{t:'Sales (Bar & Kitchen)',f:[['date','date','Date'],['dept','select','Dept',['Bar','Restaurant']],['item','text','Item'],['qty','number','Qty'],['price','number','Unit price'],['method','select','Payment',PAY],['by','text','Served by']],
  c:[['Total',r=>n(r.qty)*n(r.price)]]},
 stock:{t:'Stock',f:[['item','text','Item'],['dept','select','Area',['Bar','Kitchen','Store','Housekeeping']],['unit','text','Unit'],['open','number','Opening'],['recv','number','Received'],['used','number','Used / sold'],['reorder','number','Reorder level'],['supplier','text','Supplier']],
  c:[['Closing',r=>n(r.open)+n(r.recv)-n(r.used)]]},
 exp:{t:'Expenses',f:[['date','date','Date'],['type','select','Type',['Supplies','Rent','Utilities','Wages','Repairs','Licences','Transport','Other']],['desc','text','Description'],['amount','number','Amount'],['method','select','Paid by',PAY.slice(0,3)]],c:[]}
};
const S={rooms:[],sales:[],stock:[],exp:[],menu:[]}, refs={}, ui={tab:'dash',q:'',cart:{},edit:false,pm:'Cash',note:'',rcpt:null};
const KEYS=Object.keys(M), STORE=[...KEYS,'menu'];
const tot=(k,r)=>M[k].c.length?M[k].c[0][1](r):0;
function persist(k){
  try{localStorage.setItem('rec_'+k,JSON.stringify(S[k]))}catch(e){}
  if(refs[k])refs[k].set({rows:S[k]}).catch(()=>{});
}
function loadLocal(){STORE.forEach(k=>{try{const v=JSON.parse(localStorage.getItem('rec_'+k)||'null');if(Array.isArray(v))S[k]=v}catch(e){}})}
async function connect(){
  try{
    if(!window.claude||!claude.use)return;
    const db=await claude.use('db'); if(!db)return;
    STORE.forEach(k=>{refs[k]=db.doc('rec/'+k);
      refs[k].onSnapshot(s=>{if(s.exists&&Array.isArray(s.data().rows)){S[k]=s.data().rows;if(!document.activeElement||document.activeElement.tagName!=='INPUT')render()}
        else if(S[k].length)persist(k)},()=>{})});
  }catch(e){}
}
function nav(){
  const tabs=[['dash','Dashboard'],['pos','Bar POS'],...KEYS.map(k=>[k,M[k].t])];
  document.getElementById('nav').innerHTML=tabs.map(([k,t])=>`<button class="${ui.tab===k?'on':''}" data-t="${k}">${t}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{ui.tab=b.dataset.t;ui.q='';render()});
}
function dash(){
  const t=today(), mo=t.slice(0,7), inRange=(d,p)=>(d||'').startsWith(p);
  const sum=(arr,f,p)=>arr.filter(r=>inRange(r.date,p)).reduce((a,r)=>a+f(r),0);
  const sl=(dep,p)=>S.sales.filter(r=>inRange(r.date,p)&&(!dep||r.dept===dep)).reduce((a,r)=>a+tot('sales',r),0);
  const rm=p=>sum(S.rooms,r=>n(r.paid),p), ex=p=>sum(S.exp,r=>n(r.amount),p);
  const inHouse=S.rooms.filter(r=>r.status==='Checked in').length;
  const owed=S.rooms.reduce((a,r)=>a+Math.max(0,tot('rooms',r)-n(r.paid)),0)+S.sales.filter(r=>['Tab / credit','Room charge'].includes(r.method)).reduce((a,r)=>a+tot('sales',r),0);
  const low=S.stock.filter(r=>M.stock.c[0][1](r)<=n(r.reorder)&&r.item);
  const row=(l,a,b)=>`<tr><td>${l}</td><td class="n">${fmt(a)}</td><td class="n">${fmt(b)}</td></tr>`;
  const inc=p=>sl(0,p)+rm(p);
  return `<div class="grid">
   <div class="stat"><small>Today's income</small><b>${fmt(inc(t))}</b></div>
   <div class="stat"><small>Today's expenses</small><b>${fmt(ex(t))}</b></div>
   <div class="stat"><small>Today's net</small><b class="${inc(t)-ex(t)<0?'low':'pos'}">${fmt(inc(t)-ex(t))}</b></div>
   <div class="stat"><small>Guests in house</small><b>${inHouse}</b></div>
   <div class="stat"><small>Unpaid (rooms + tabs)</small><b>${fmt(owed)}</b></div></div>
  <div class="card" style="margin-top:14px"><div class="wrap"><table><tr><th></th><th class="n">Today</th><th class="n">This month</th></tr>
   ${row('Bar sales',sl('Bar',t),sl('Bar',mo))}${row('Restaurant sales',sl('Restaurant',t),sl('Restaurant',mo))}${row('Room payments',rm(t),rm(mo))}
   ${row('<b>Total income</b>',inc(t),inc(mo))}${row('Expenses',ex(t),ex(mo))}${row('<b>Net</b>',inc(t)-ex(t),inc(mo)-ex(mo))}</table></div></div>
  <div class="card"><b>Low stock</b>${low.length?`<div class="wrap"><table><tr><th>Item</th><th>Area</th><th class="n">Closing</th><th class="n">Reorder at</th><th>Supplier</th></tr>${low.map(r=>`<tr><td>${esc(r.item)}</td><td>${esc(r.dept)}</td><td class="n low">${fmt(M.stock.c[0][1](r))}</td><td class="n">${fmt(r.reorder)}</td><td>${esc(r.supplier)}</td></tr>`).join('')}</table></div>`:'<p class="note">Nothing needs reordering.</p>'}</div>
  <div class="card"><b>Backup</b><p class="note">Records are stored on this phone only. Save a backup file regularly, and use Restore to load one.</p><button class="btn g" id="bk">Save backup</button> <label class="btn g" style="display:inline-block">Restore<input id="rs" type="file" accept=".json" hidden></label></div>`;
}
function mod(k){
  const m=M[k], isNum=f=>f[1]==='number';
  const form=m.f.map(f=>{const id='f_'+f[0];
    const inp=f[1]==='select'?`<select id="${id}">${f[3].map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:`<input id="${id}" type="${f[1]}" ${f[1]==='number'?'step="any" min="0"':''} ${f[1]==='date'?`value="${today()}"`:''}>`;
    return `<div><label for="${id}">${f[2]}</label>${inp}</div>`}).join('');
  const q=ui.q.toLowerCase();
  const rows=S[k].filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q)).slice().reverse();
  const head=m.f.map(f=>`<th${isNum(f)?' class="n"':''}>${f[2]}</th>`).join('')+m.c.map(c=>`<th class="n">${c[0]}</th>`).join('')+'<th></th>';
  const body=rows.map(r=>`<tr>${m.f.map(f=>`<td${isNum(f)?' class="n"':''}>${isNum(f)?fmt(r[f[0]]):esc(r[f[0]])}</td>`).join('')}${m.c.map((c,i)=>{const v=c[1](r);const cls=(k==='rooms'&&i===1&&v>0)||(k==='stock'&&v<=n(r.reorder))?' low':'';return `<td class="n${cls}">${fmt(v)}</td>`}).join('')}<td><button class="x" data-del="${r.id}" title="Delete">✕</button></td></tr>`).join('');
  const total=m.c.length?`Total: <b>${fmt(rows.reduce((a,r)=>a+m.c[0][1](r),0))}</b> (${rows.length} records)`:`Total: <b>${fmt(rows.reduce((a,r)=>a+n(r.amount),0))}</b> (${rows.length} records)`;
  return `<div class="card"><form id="frm">${form}<button class="btn" type="submit">Add record</button></form></div>
  <div class="card"><div class="bar"><input id="srch" placeholder="Search…" value="${esc(ui.q)}"><span>${k==='stock'?`${rows.length} items`:total}</span><span><button class="btn g" id="csv">CSV</button> <button class="btn g" onclick="print()">Print</button></span></div>
  <div class="wrap"><table><tr>${head}</tr>${body||`<tr><td colspan="${m.f.length+m.c.length+1}" class="note">No records yet.</td></tr>`}</table></div></div>`;
}
function bind(k){
  const m=M[k];
  document.getElementById('frm').onsubmit=e=>{e.preventDefault();
    const r={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5)};
    m.f.forEach(f=>r[f[0]]=document.getElementById('f_'+f[0]).value);
    S[k].push(r);persist(k);render()};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this record?')){S[k]=S[k].filter(r=>r.id!==b.dataset.del);persist(k);render()}});
  const s=document.getElementById('srch');
  s.oninput=()=>{ui.q=s.value;const p=s.selectionStart;render();const s2=document.getElementById('srch');s2.focus();s2.setSelectionRange(p,p)};
  document.getElementById('csv').onclick=async()=>{
    const cols=[...m.f.map(f=>f[2]),...m.c.map(c=>c[0])];
    const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const csv=[cols.map(q).join(','),...S[k].map(r=>[...m.f.map(f=>q(r[f[0]])),...m.c.map(c=>c[1](r))].join(','))].join('\n');
    try{const d=await claude.use('downloads');if(d){await d.save({filename:k+'-records.csv',data:csv});return}}catch(e){}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=k+'-records.csv';a.click();
  };
}
function pos(){
  const cat={};S.menu.forEach(i=>(cat[i.cat||'Other']=cat[i.cat||'Other']||[]).push(i));
  const lines=Object.entries(ui.cart).map(([id,q])=>{const i=S.menu.find(m=>m.id===id);return i&&q>0?{...i,q}:null}).filter(Boolean);
  const total=lines.reduce((a,l)=>a+l.q*n(l.price),0);
  const items=Object.entries(cat).map(([c,a])=>`<h4>${esc(c)}</h4><div class="items">${a.map(i=>`<button class="item" data-add="${i.id}"><b>${esc(i.name)}</b><span>${fmt(i.price)}</span>${ui.edit?`<i class="x" data-mdel="${i.id}">✕</i>`:''}</button>`).join('')}</div>`).join('')||'<p class="note">No menu yet. Tap “Edit menu” and add your drinks and prices.</p>';
  let ck='';try{ck=localStorage.getItem('cashier')||''}catch(e){}
  const rc=ui.rcpt?`<div class="card" id="rcpt"><b>Lorugum Guest House — Bar receipt</b><div class="note">${esc(ui.rcpt.time)} · ${esc(ui.rcpt.method)}${ui.rcpt.note?' · '+esc(ui.rcpt.note):''}</div>${ui.rcpt.lines.map(l=>`<div class="ln"><span>${l.q} × ${esc(l.name)}</span><span>${fmt(l.q*n(l.price))}</span></div>`).join('')}<div class="big">Total ${fmt(ui.rcpt.total)}</div><button class="btn g noprint" id="rpr">Print receipt</button></div>`:'';
  return `${rc}<div class="pos"><div class="card"><div class="bar"><b>Menu</b><button class="btn g" id="edt">${ui.edit?'Done':'Edit menu'}</button></div>
  ${ui.edit?`<form id="mf"><div><label>Item</label><input id="m_n" required></div><div><label>Category</label><input id="m_c" placeholder="Beer, Spirits, Soda…"></div><div><label>Price</label><input id="m_p" type="number" step="any" min="0" required></div><button class="btn" type="submit">Add item</button></form>`:''}${items}</div>
  <div class="card"><b>Current order</b>${lines.map(l=>`<div class="ln"><span>${esc(l.name)}</span><span class="q"><button data-q="${l.id}|-1">−</button> ${l.q} <button data-q="${l.id}|1">+</button></span><span>${fmt(l.q*n(l.price))}</span></div>`).join('')||'<p class="note">Tap items to add them.</p>'}
  <div class="big">Total ${fmt(total)}</div>
  <div><label>Payment</label><select id="pm">${PAY.map(o=>`<option${o===ui.pm?' selected':''}>${o}</option>`).join('')}</select></div>
  <div><label>Room no. / customer (needed for room charge or tab)</label><input id="pn" value="${esc(ui.note)}"></div>
  <div><label>Served by</label><input id="pc" value="${esc(ck)}"></div>
  <button class="btn" id="chg" ${total?'':'disabled'}>Charge ${fmt(total)}</button> <button class="btn g" id="clr">Clear</button>
  <p class="note">Each sale is saved to Sales and deducts from Stock when an item name matches.</p></div></div>`;
}
function bindPos(){
  const $=id=>document.getElementById(id);
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(ui.edit)return;const id=b.dataset.add;ui.cart[id]=(ui.cart[id]||0)+1;render()});
  document.querySelectorAll('[data-mdel]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(confirm('Remove this menu item?')){S.menu=S.menu.filter(m=>m.id!==b.dataset.mdel);delete ui.cart[b.dataset.mdel];persist('menu');render()}});
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const[id,d]=b.dataset.q.split('|');ui.cart[id]=Math.max(0,(ui.cart[id]||0)+ +d);render()});
  $('edt').onclick=()=>{ui.edit=!ui.edit;render()};
  $('clr').onclick=()=>{ui.cart={};render()};
  $('pm').onchange=e=>ui.pm=e.target.value;
  $('pn').oninput=e=>ui.note=e.target.value;
  if($('mf'))$('mf').onsubmit=e=>{e.preventDefault();S.menu.push({id:Date.now().toString(36),name:$('m_n').value.trim(),cat:$('m_c').value.trim(),price:$('m_p').value});persist('menu');render()};
  if($('rpr'))$('rpr').onclick=()=>{document.body.classList.add('pr');print();document.body.classList.remove('pr')};
  $('chg').onclick=()=>{
    const lines=Object.entries(ui.cart).map(([id,q])=>{const i=S.menu.find(m=>m.id===id);return i&&q>0?{...i,q}:null}).filter(Boolean);
    if(!lines.length)return;
    if(['Room charge','Tab / credit'].includes(ui.pm)&&!ui.note.trim()){alert('Enter the room number or customer name for this charge.');return}
    const by=$('pc').value.trim();try{localStorage.setItem('cashier',by)}catch(e){}
    const d=today(),stamp=Date.now().toString(36);let touched=false;
    lines.forEach((l,x)=>{
      S.sales.push({id:stamp+x,date:d,dept:'Bar',item:l.name,qty:l.q,price:l.price,method:ui.pm,by:[by,ui.note.trim()].filter(Boolean).join(' / ')});
      const st=S.stock.find(s=>String(s.item).toLowerCase()===l.name.toLowerCase());
      if(st){st.used=String(n(st.used)+l.q);touched=true}
    });
    persist('sales');if(touched)persist('stock');
    ui.rcpt={lines,total:lines.reduce((a,l)=>a+l.q*n(l.price),0),method:ui.pm,note:ui.note.trim(),time:new Date().toLocaleString()};
    ui.cart={};ui.note='';render();
  };
}
function bindBk(){
  document.getElementById('bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='lorugum-backup-'+today()+'.json';a.click()};
  document.getElementById('rs').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!confirm('Replace all records on this phone with this backup?'))return;STORE.forEach(k=>{if(Array.isArray(d[k])){S[k]=d[k];persist(k)}});render()}catch(x){alert('That file is not a valid backup.')}};rd.readAsText(f)};
}
function render(){nav();const el=document.getElementById('main');
  if(ui.tab==='dash'){el.innerHTML=dash();bindBk();}else if(ui.tab==='pos'){el.innerHTML=pos();bindPos();}else{el.innerHTML=mod(ui.tab);bind(ui.tab);}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
loadLocal();render();connect();
</script></body></html>
